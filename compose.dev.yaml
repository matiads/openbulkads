services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openbulkads_dev
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: openbulkads_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbulkads_dev -d openbulkads_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
